# Automatically scales the backend Deployment between 2 and 5 replicas
# based on average CPU utilization across its Pods, checked periodically
# against the 60% target. Depends on two things already in place:
# 1) resources.requests.cpu set on the backend container (06-backend-deployment.yaml) —
#    that's the baseline "100%" is measured against.
# 2) the metrics-server add-on, which AKS enables by default, so no extra
#    setup is needed for this to work.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
