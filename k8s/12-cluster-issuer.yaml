# A ClusterIssuer tells cert-manager HOW to get certificates — here, from
# Let's Encrypt's production ACME server, proving domain ownership via the
# HTTP-01 challenge (cert-manager briefly serves a token at
# http://<host>/.well-known/acme-challenge/... through ingress-nginx, and
# Let's Encrypt fetches it over the internet to confirm you control that
# host). It's "Cluster"-scoped, not namespaced, because it can issue
# certificates for Ingresses in any namespace — one issuer for the whole
# cluster instead of one per app.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: vishal.k.official8062@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
