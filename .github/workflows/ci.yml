name: CI - Build, Test, and Push Images

# Only on pushes to main — this matches exactly what the federated
# credential's "subject" trusts (repo:...:ref:refs/heads/main). A push to
# any other branch, or a PR, would fail the Azure login step by design.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required so this workflow can request an OIDC token from GitHub
  contents: read

env:
  ACR_LOGIN_SERVER: kubecontainer01.azurecr.io

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

      - name: Log in to Azure (OIDC — no password/secret involved)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name kubecontainer01

      - name: Build and push backend image
        working-directory: backend
        run: |
          docker build -t $ACR_LOGIN_SERVER/tasktracker-b:${{ github.sha }} .
          docker push $ACR_LOGIN_SERVER/tasktracker-b:${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app
        working-directory: frontend
        run: npm run build

      - name: Log in to Azure (OIDC — no password/secret involved)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name kubecontainer01

      - name: Build and push frontend image
        working-directory: frontend
        run: |
          docker build -t $ACR_LOGIN_SERVER/tasktracker-f:${{ github.sha }} .
          docker push $ACR_LOGIN_SERVER/tasktracker-f:${{ github.sha }}
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # only runs if BOTH image builds succeeded
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC — no password/secret involved)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group vishal-kube-01 --name kubernetes01 --overwrite-existing

      - name: Point the manifests at this run's image tag
        run: |
          sed -i "s#tasktracker-b:latest#tasktracker-b:${{ github.sha }}#" k8s/06-backend-deployment.yaml
          sed -i "s#tasktracker-f:latest#tasktracker-f:${{ github.sha }}#" k8s/09-frontend-deployment.yaml

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout to succeed (fails the job if it doesn't)
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Smoke test
        run: curl -sf https://20-7-92-92.nip.io/api/health