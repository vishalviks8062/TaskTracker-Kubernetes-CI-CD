name: CI - Build, Test, and Push Images

# Only on pushes to main — this matches exactly what the federated
# credential's "subject" trusts (repo:...:ref:refs/heads/main). A push to
# any other branch, or a PR, would fail the Azure login step by design.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required so this workflow can request an OIDC token from GitHub
  contents: read

env:
  ACR_LOGIN_SERVER: kubecontainer01.azurecr.io

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

      - name: Log in to Azure (OIDC — no password/secret involved)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name kubecontainer01

      - name: Build and push backend image
        working-directory: backend
        run: |
          docker build -t $ACR_LOGIN_SERVER/tasktracker-b:${{ github.sha }} .
          docker push $ACR_LOGIN_SERVER/tasktracker-b:${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app
        working-directory: frontend
        run: npm run build

      - name: Log in to Azure (OIDC — no password/secret involved)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name kubecontainer01

      - name: Build and push frontend image
        working-directory: frontend
        run: |
          docker build -t $ACR_LOGIN_SERVER/tasktracker-f:${{ github.sha }} .
          docker push $ACR_LOGIN_SERVER/tasktracker-f:${{ github.sha }}