server.port=8080

# Nothing here is hardcoded: DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD are
# all environment variables, injected by docker-compose locally and by a
# ConfigMap + Secret in Kubernetes (see k8s/06-backend-deployment.yaml).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" auto-creates/updates the tasks table from the @Entity below.
# Fine for learning; a real project would use versioned migrations
# (Flyway/Liquibase) instead of letting Hibernate manage the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Signing key for JWTs, from the JWT_SECRET env var (K8s Secret) — never hardcoded.
jwt.secret=${JWT_SECRET}
